name: Bilibili Manga Coupon Exchange

on:
  schedule:
    # 北京时间每天 23:58 启动
    # → Python 等待到次日 00:00:00
    - cron: '58 23 * * *'
      timezone: Asia/Shanghai

    # 北京时间每天 09:50 启动
    # → Python 等待到当天 10:00:00
    - cron: '50 9 * * *'
      timezone: Asia/Shanghai

  workflow_dispatch:
    inputs:
      test_only:
        description: '只查询积分商城商品，不执行兑换'
        required: true
        default: true
        type: boolean

      wait_until_target:
        description: '手动运行时是否等待到下一个抢券时间'
        required: true
        default: false
        type: boolean

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run manga coupon exchange
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

          # Telegram
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 抢券策略
          MANGA_EXCHANGE_RETRY: ${{ vars.MANGA_EXCHANGE_RETRY }}
          MANGA_EXCHANGE_NUM: ${{ vars.MANGA_EXCHANGE_NUM }}

          # Python 根据目标时间自动判断是否跨天
          MANGA_TARGET_HOUR: ${{ github.event.schedule == '58 23 * * *' && '00' || '10' }}
          MANGA_TARGET_MINUTE: '00'

          # 手动运行：
          # test_only=true  -> 只测试
          # test_only=false -> 真正兑换
          #
          # schedule：
          # 始终真正兑换
          MANGA_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || false }}

          # 告诉 Python 本次是午夜场还是上午场
          MANGA_TARGET_SLOT: ${{ github.event.schedule == '58 23 * * *' && 'midnight' || 'morning' }}

        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Target slot: $MANGA_TARGET_SLOT"
          echo "Target: $MANGA_TARGET_HOUR:$MANGA_TARGET_MINUTE"
          echo "Test only: $MANGA_TEST_ONLY"

          python manga_exchange.py
