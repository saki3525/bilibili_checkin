name: Bilibili Manga Coupon Exchange

on:
  schedule:
    # 北京时间 23:58 启动
    # GitHub Actions 使用 UTC，因此为 15:58 UTC
    - cron: '55 15 * * *'

    # 北京时间 09:58 启动
    # GitHub Actions 使用 UTC，因此为 01:58 UTC
    - cron: '55 1 * * *'

  workflow_dispatch:
    inputs:
      test_only:
        description: '只查询积分商城商品，不执行兑换'
        required: true
        default: true
        type: boolean

      target_slot:
        description: '手动运行测试/抢券场次'
        required: true
        default: 'morning'
        type: choice
        options:
          - midnight
          - morning

      wait_until_target:
        description: '手动运行时是否等待目标时间'
        required: true
        default: false
        type: boolean


jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run manga coupon exchange
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          MANGA_EXCHANGE_RETRY: ${{ vars.MANGA_EXCHANGE_RETRY }}
          MANGA_EXCHANGE_NUM: ${{ vars.MANGA_EXCHANGE_NUM }}

          # 手动运行：
          # true  = 测试，只查询
          # false = 真正抢券
          #
          # 定时运行：
          # 固定 false
          MANGA_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || false }}

          # 定时任务根据 cron 判断场次。
          # 手动运行使用 target_slot。
          MANGA_TARGET_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_slot || (github.event.schedule == '55 15 * * *' && 'midnight' || 'morning') }}

        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Target slot: $MANGA_TARGET_SLOT"
          echo "Test only: $MANGA_TEST_ONLY"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.wait_until_target }}" != "true" ]; then
            echo "Manual run: 不等待目标时间。"
          else
            echo "按照目标时间运行。"
          fi

          python manga_exchange.py
