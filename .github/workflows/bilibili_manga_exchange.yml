name: Bilibili Manga Coupon Exchange

on:
  schedule:
    # GitHub Actions 支持 IANA timezone。
    # 每天北京时间 11:58 启动，Python 再 sleep 到 12:00:00。
    - cron: '58 11 * * *'
      timezone: Asia/Shanghai

  workflow_dispatch:
    inputs:
      test_only:
        description: '只查询积分商城商品，不执行兑换'
        required: true
        default: true
        type: boolean
      wait_until_target:
        description: '手动运行时是否等待到北京时间 12:00'
        required: true
        default: false
        type: boolean

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run manga coupon exchange
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

          # Telegram：放在 Settings -> Secrets and variables -> Actions -> Secrets
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 抢券策略：放在 Actions -> Variables
          MANGA_EXCHANGE_RETRY: ${{ vars.MANGA_EXCHANGE_RETRY }}
          MANGA_EXCHANGE_NUM: ${{ vars.MANGA_EXCHANGE_NUM }}

          MANGA_TARGET_HOUR: '12'
          MANGA_TARGET_MINUTE: '00'

          # 手动测试默认不兑换；定时运行始终执行兑换。
          MANGA_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || '0' }}
          test_only = os.getenv("MANGA_TEST_ONLY", "0").lower() in ("1", "true", "yes")
          log(f"测试模式: test_only={test_only!r}, MANGA_TEST_ONLY={os.getenv('MANGA_TEST_ONLY')!r}")

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.wait_until_target }}" != "true" ]; then
            # 手动立即测试/运行：把目标时间设为当前北京时间之前，
            # 从而跳过 sleep。
            export MANGA_TARGET_HOUR="$(TZ=Asia/Shanghai date +%H)"
            export MANGA_TARGET_MINUTE="$(TZ=Asia/Shanghai date +%M)"
          fi

          python manga_exchange.py
