name: Bilibili Manga Coupon Exchange

on:
  schedule:
    # 北京时间 23:58 启动 → 次日 00:00 抢券
    - cron: '58 23 * * *'
      timezone: Asia/Shanghai

    # 北京时间 09:58 启动 → 当天 10:00 抢券
    - cron: '58 9 * * *'
      timezone: Asia/Shanghai

  workflow_dispatch:
    inputs:
      test_only:
        description: '只查询积分商城商品，不执行兑换'
        required: true
        default: true
        type: boolean

      wait_until_target:
        description: '手动运行时是否等待目标时间'
        required: true
        default: false
        type: boolean

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run manga coupon exchange
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

          # Telegram
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 抢券策略
          MANGA_EXCHANGE_RETRY: ${{ vars.MANGA_EXCHANGE_RETRY }}
          MANGA_EXCHANGE_NUM: ${{ vars.MANGA_EXCHANGE_NUM }}

          # Python 根据目标时间自动判断是否跨天
          MANGA_TARGET_HOUR: ${{ github.event.schedule == '58 23 * * *' && '00' || '10' }}
          MANGA_TARGET_MINUTE: '00'

          # 手动运行：
          # test_only=true  -> 只测试
          # test_only=false -> 真正兑换
          #
          # schedule：
          # 始终真正兑换
          MANGA_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || false }}

          # 告诉 Python 本次是午夜场还是上午场
          MANGA_TARGET_SLOT: ${{ github.event.schedule == '58 23 * * *' && 'midnight' || 'morning' }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.wait_until_target }}" != "true" ]; then
            export MANGA_TEST_ONLY="${{ inputs.test_only }}"
          fi

          python manga_exchange.py
