name: Bilibili Manga Coupon Exchange

on:
  schedule:
    # 每天北京时间 11:58 启动。
    # Python 会继续等待到北京时间 12:00:00。
    - cron: '58 11 * * *'
      timezone: Asia/Shanghai

  workflow_dispatch:
    inputs:
      test_only:
        description: '只查询积分商城商品，不执行兑换'
        required: true
        default: true
        type: boolean

      wait_until_target:
        description: '手动运行时是否等待到北京时间 12:00'
        required: true
        default: false
        type: boolean

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run manga coupon exchange
        env:
          # Bilibili Cookie
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

          # Telegram
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 抢券策略
          MANGA_EXCHANGE_RETRY: ${{ vars.MANGA_EXCHANGE_RETRY }}
          MANGA_EXCHANGE_NUM: ${{ vars.MANGA_EXCHANGE_NUM }}

          # 目标时间：北京时间 12:00
          MANGA_TARGET_HOUR: '12'
          MANGA_TARGET_MINUTE: '00'

          # 手动运行：
          #   test_only=true  → 只测试，不兑换
          #   test_only=false → 执行兑换
          #
          # 定时运行：
          #   固定为 0 → 正常执行兑换
          MANGA_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || false }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.wait_until_target }}" != "true" ]; then
            # 手动立即测试/运行：
            # 将目标时间设为当前北京时间，
            # 从而跳过等待。
            export MANGA_TARGET_HOUR="$(TZ=Asia/Shanghai date +%H)"
            export MANGA_TARGET_MINUTE="$(TZ=Asia/Shanghai date +%M)"
          fi

          python manga_exchange.py
